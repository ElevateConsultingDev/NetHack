<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetHack</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
:root { --bg: #0d1014; --panel: #151a21; --line: #262d37; --fg: #c8d0da; --dim: #7b8592;
        --green: #6fcf7a; --yellow: #e6c35c; --red: #ef6b6b; --magenta: #c58ae6; --blue: #6aa8ef; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
             font: 13px/1.4 Menlo, "DejaVu Sans Mono", monospace; }
#app { display: grid; grid-template-columns: minmax(0, 1fr) 6px var(--panel-w, 420px) 6px var(--chat-w, 460px);
       grid-template-rows: minmax(0, 1fr); height: 100vh; }  /* the columns never outgrow the window */
.split { cursor: col-resize; background: var(--line); } .split:hover, .split.on { background: var(--blue); }
.xterm-viewport { overflow-y: hidden !important; }  /* no scrollback, so no scrollbar */
#game { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
#bar { display: flex; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
         padding: 3px 8px; font: inherit; cursor: pointer; }
button:hover { border-color: var(--blue); }
#term { flex: 1; min-height: 0; padding: 4px; }
.col { overflow-y: auto; padding: 8px 10px; background: var(--panel); }
h3 { margin: 10px 0 4px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
h3:first-child { margin-top: 0; }
.b { font-weight: bold; } .dim { color: var(--dim); } .green { color: var(--green); }
.yellow { color: var(--yellow); } .red { color: var(--red); } .magenta { color: var(--magenta); }
.group { cursor: pointer; text-decoration: underline; margin-top: 4px; }
.item { display: flex; gap: 6px; cursor: pointer; padding: 1px 2px; border-radius: 3px; }
.item:hover { background: var(--line); }
.item .w { margin-left: auto; color: var(--dim); }
.item.off { opacity: .4; }
.acts { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 6px 18px; }
#chatcol { display: flex; flex-direction: column; padding: 0; }
#chat { flex: 1; overflow-y: auto; padding: 8px 10px; white-space: pre-wrap; }
#chat .you { color: var(--blue); margin-top: 8px; } #chat .err { color: var(--red); }
#chat .warn { color: var(--yellow); } #chat .dim { color: var(--dim); }
#ask { display: flex; border-top: 1px solid var(--line); }
#ask input { flex: 1; background: var(--bg); color: var(--fg); border: 0; padding: 8px 10px; font: inherit; outline: none; }
.term { cursor: pointer; border-bottom: 1px dotted transparent; } .term:hover { border-bottom-color: currentColor; }
#tip { position: fixed; display: none; z-index: 5; max-width: 360px; background: var(--bg); border: 1px solid var(--blue);
       border-radius: 6px; padding: 8px 10px; box-shadow: 0 6px 20px #0008; }
#tip .acts { margin: 6px 0 0; }
#saves { position: fixed; inset: 0; background: #000a; display: none; place-items: center; }
#saves .box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px;
              width: min(720px, 94vw); max-height: 80vh; display: flex; flex-direction: column; gap: 8px; }
#saves .list { overflow-y: auto; }
#saves .row { display: grid; grid-template-columns: 140px 1fr 160px; gap: 8px; padding: 2px 6px; cursor: pointer; }
#saves .row.sel { background: var(--blue); color: var(--bg); }
@media (max-width: 1100px) { #app { grid-template-columns: 1fr; grid-template-rows: none; height: auto; } #game { height: 80vh; } .split { display: none; }
                             .col { border-left: 0; border-top: 1px solid var(--line); } #chatcol { height: 60vh; } }
</style>
</head>
<body>
<div id="app">
  <div id="game">
    <div id="bar">
      <button data-cmd="whatnow">What now?</button>
      <button data-cmd="fog">Fog</button>
      <button data-cmd="down">To &gt; stairs</button>
      <button data-cmd="up">To &lt; stairs</button>
      <button data-cmd="checkpoint">Checkpoint</button>
      <button data-cmd="rewind">Back to checkpoint</button>
      <button id="opensaves">Saves</button>
      <span style="margin-left:auto"></span>
      <button data-zoom="-1" title="Smaller map">−</button><span id="zoomlevel" class="dim" style="align-self:center"></span><button data-zoom="1" title="Bigger map">+</button>
    </div>
    <div id="term"></div>
  </div>
  <div class="split" data-split="panel"></div>
  <div class="col" id="panel"></div>
  <div class="split" data-split="chat"></div>
  <div class="col" id="chatcol">
    <div id="chat"></div>
    <form id="ask"><input placeholder="Ask the helper..." autocomplete="off"></form>
  </div>
</div>
<div id="tip"></div>
<div id="saves"><div class="box"><div id="savestitle" class="b"></div><div class="list"></div>
  <div><button data-key="&#13;">Load</button> <button data-key="d">Delete</button> <button data-key="p">Prune to newest 3</button>
       <button id="newgame">New game</button> <button data-key="&#27;">Close</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
const $ = s => document.querySelector(s);
const post = (path, body) => fetch(path, {method: 'POST', body: JSON.stringify(body)});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

const term = new Terminal({fontSize: +(localStorageGet('nh.zoom') || 18), cursorBlink: true, scrollback: 0, macOptionIsMeta: true,
  fontFamily: 'Menlo, "DejaVu Sans Mono", monospace', theme: {background: '#0d1014', foreground: '#c8d0da'}});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open($('#term'));
term.onData(d => post('/key', {data: d}));

// the map's zoom is the text size: yours to set (- / + above the game), and kept when
// the window or the columns change size (they change how much fits, not the size)
let sized = '', settling;
function zoom(step) {
  const size = Math.max(9, Math.min(40, term.options.fontSize + step));
  term.options.fontSize = size;
  fit.fit();
  if (step > 0 && (term.cols < 80 || term.rows < 24)) { term.options.fontSize = size - step; fit.fit(); return; }  // the game needs 80x24
  localStorageSet('nh.zoom', size);
  $('#zoomlevel').textContent = size;
  refit();
}
function refit() {
  fit.fit();
  const now = term.cols + 'x' + term.rows;
  if (now !== sized) { sized = now; post('/resize', {cols: term.cols, rows: term.rows}); }
}
addEventListener('resize', () => { clearTimeout(settling); settling = setTimeout(refit, 150); });

// drag the bars between the columns; the widths are remembered in this browser
const app = $('#app');
for (const k of ['panel', 'chat']) { const w = localStorageGet('nh.' + k); if (w) app.style.setProperty(`--${k}-w`, w + 'px'); }
for (const bar of document.querySelectorAll('.split')) {
  bar.addEventListener('pointerdown', e => {
    e.preventDefault();
    bar.setPointerCapture(e.pointerId);
    bar.classList.add('on');
    const k = bar.dataset.split, col = bar.nextElementSibling, x0 = e.clientX, w0 = col.getBoundingClientRect().width;
    const move = e => {
      const other = [...document.querySelectorAll('.col')].find(c => c !== col).getBoundingClientRect().width;
      const cell = $('#term .xterm-screen').getBoundingClientRect().width / term.cols;  // the game keeps its 80 columns
      const w = Math.max(200, Math.min(innerWidth - other - 12 - 82 * cell - 8, w0 - (e.clientX - x0)));
      app.style.setProperty(`--${k}-w`, w + 'px');
      localStorageSet('nh.' + k, Math.round(w));
      clearTimeout(settling); settling = setTimeout(refit, 50);
    };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', () => { bar.removeEventListener('pointermove', move); bar.classList.remove('on'); term.focus(); }, {once: true});
  });
}
fit.fit();
while ((term.cols < 80 || term.rows < 24) && term.options.fontSize > 9) { term.options.fontSize--; fit.fit(); }  // a small window: fit the game first
$('#zoomlevel').textContent = term.options.fontSize;
refit();
term.focus();

// panels from the game's state
const GROUPS = [['$', 'Coins'], [')', 'Weapons'], ['[', 'Armor'], ['%', 'Food'], ['?', 'Scrolls'],
  ['+', 'Spellbooks'], ['!', 'Potions'], ['=', 'Rings'], ['"', 'Amulets'], ['/', 'Wands'], ['(', 'Tools'],
  ['*', 'Gems & rocks'], ['`', 'Boulders & statues'], ['0', 'Iron balls'], ['_', 'Chains']];
const IN_USE = /\((being worn|weapon in hand|wielded|on left|on right|in quiver|lit|in use|embedded|tethered|attached|chained|alternate weapon; not wielded)/;
let open = new Set(JSON.parse(localStorageGet('nh.open') || '[]')), popup = null, last = null;
function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function strength(s) { return 18 < s && s <= 117 ? `18/${String(s - 18).padStart(2, '0')}` : s === 118 ? '18/**' : String(s > 118 ? s - 100 : s); }

// click a word in the panel: what it means, and a button to ask the helper about it here and now
const GLOSS = {
  'HP': 'Hit points. At 0 you die. They come back slowly on their own (faster at higher level and Con). Under 1/7 of the maximum (or under 6) counts as major trouble, so prayer can fix it.',
  'Pw': 'Power, the energy spells cost (5 per spell level). It comes back over time, faster with high Wisdom and Intelligence.',
  'AC': 'Armor class. Lower is better: 10 is naked. Below 0, every hit you take is also reduced by a random 1 to |AC| points, and monsters miss far more often.',
  'Xp': 'Experience level / experience points. Each level raises max HP and Pw, to-hit, and unlocks role abilities. Level drain (some undead) takes levels away unless you resist it.',
  '$': 'Gold. Pays shopkeepers and priests: donating 400 times your level to a temple priest can buy a point of AC (protection), and 600 times when you are poor in protection helps more.',
  'T': 'Turns (game moves) since the game began. Many timers count in turns: prayer timeout, hunger, spell memory.',
  'Dlvl': 'Dungeon level: how deep you are. Deeper levels make tougher monsters (together with your own experience level).',
  'Sokoban': 'A puzzle branch going up from the level after the Oracle. Push boulders (move into them) to fill the holes. Breaking boulders, reading earth, squeezing past them or levitating over holes costs Luck. The top level holds a bag of holding or an amulet of reflection.',
  'The Gnomish Mines': 'A branch going down from Dlvl 2 to 4. Full of gnomes, dwarves and hill orcs (peaceful to gnomes and dwarves). Minetown has a temple, shops and an altar; Mines\' End has a luckstone.',
  'The Dungeons of Doom': 'The main dungeon. The Oracle, the Big Room, the Quest portal, Medusa and the Castle are along it.',
  'Location': 'Where you are on the map: x is the column (1 at the left edge), y the row (0 at the top). The helper uses these to point at things.',
  'St': 'Strength: to-hit, damage and how much you can carry. 18/01 to 18/** is exceptional strength, between 18 and 19.',
  'Dx': 'Dexterity: to-hit, especially for thrown and fired weapons.',
  'Co': 'Constitution: HP gained per level, HP regeneration, and carrying capacity.',
  'In': 'Intelligence: spell success for most roles (Wizards especially).',
  'Wi': 'Wisdom: Pw regeneration and Pw gained per level; spell success for Priests, Monks, Healers, Knights and Valkyries.',
  'Ch': 'Charisma: shop prices, and how much some monsters charge or demand.',
  'Carrying': 'Weight carried / weight you can carry before you are Burdened (25 x (St + Co) + 50, at most 1000). Burdened and worse slow you down and stop HP regeneration when Stressed.',
  'Speed': 'Movement speed. 12 is normal: one move per turn. Intrinsic speed gives extra moves (fast about 4/3, very fast about 5/3).',
  'Next level': 'Experience points needed for the next experience level.',
  'God': 'Your god. Pray (⌥P) when in real trouble and your prayer timeout is low; sacrifice fresh corpses at a co-aligned altar for gifts and Luck.',
  'Luck': 'From -13 to 13 (beyond 10 needs a luckstone). It touches nearly every roll: to-hit, wishes, prayer, sinks. Negative Luck makes prayer fail. Without a luckstone it drifts toward 0 every 600 turns.',
  'Prayer timeout': 'Prayer is safe only below a limit: under 200 in major trouble (low HP, weak from hunger, stoning, strangling, sliming, lycanthropy, illness), under 100 in minor trouble, and only at 0 with no trouble. Each successful prayer resets it to about 300 to 350. Also needs Luck 0 or more and an unangered god.',
  'Nutrition': 'Your food clock. Hungry below 150, Weak below 50, Fainting below 0. Over 1000 is Satiated, and eating past 2000 can choke you to death.',
  'Alignment': 'Your alignment record with your god. Killing hostile monsters raises it; murder, attacking peacefuls and breaking your role\'s conduct lower it. Negative alignment makes prayer fail.',
  'Intrinsics': 'Permanent (or long-lasting) properties from corpses, levels, prayer or worn items. Click one to see what it does.',
  'fast': 'Intrinsic speed: about 4 moves for every 3 of a normal-speed creature.',
  'very fast': 'Extrinsic speed (speed boots, potion): about 5 moves per 3.',
  'fire res': 'Fire resistance: no damage from fire attacks and fire traps (your items can still burn).',
  'cold res': 'Cold resistance: no damage from cold attacks (potions can still freeze and shatter).',
  'sleep res': 'Sleep resistance: immune to sleep rays, sleeping gas traps and sleep spells.',
  'shock res': 'Shock resistance: no damage from lightning and shock (rings and wands can still explode).',
  'poison res': 'Poison resistance: poison no longer drains Str or kills outright; poisonous corpses are safe.',
  'disint res': 'Disintegration resistance: immune to black dragon breath and disintegration.',
  'acid res': 'Acid resistance: no damage from acid.',
  'stoning res': 'Stoning resistance: cockatrices cannot turn you to stone.',
  'drain res': 'Drain resistance: level drain (wraiths, vampires, Stormbringer) cannot take your levels.',
  'sickness res': 'Sickness resistance: immune to illness and food poisoning.',
  'magic res': 'Magic resistance: protects against touch of death, polymorph and teleport traps, destroy armor, many monster spells, and halves some magical damage. One of the two most important defenses.',
  'reflection': 'Reflection: rays (death, lightning, disintegration and the rest) and gaze attacks bounce back. The other most important defense.',
  'see invisible': 'See invisible: you see invisible monsters.',
  'telepathy': 'Telepathy: while blind (a blindfold or towel works) you sense the minds of monsters on the level.',
  'warning': 'Warning: numbers 0 to 5 on the map show nearby hostile monsters by how dangerous they are.',
  'searching': 'Automatic searching: you search adjacent squares for hidden doors and traps every turn.',
  'infravision': 'Infravision: you see warm-blooded monsters in the dark.',
  'invisible': 'You are invisible: most monsters have trouble hitting you; shopkeepers will not let you in.',
  'stealth': 'Stealth: you do not wake sleeping monsters as you move.',
  'regeneration': 'Regeneration: you regain 1 HP every turn (and get hungrier).',
  'teleportitis': 'Teleportitis: you teleport at random now and then (and can teleport at will from level 12, or 8 for Wizards).',
  'teleport control': 'Teleport control: you choose where you land when you teleport.',
  'polymorphitis': 'Polymorphitis: you polymorph at random. Dangerous without polymorph control.',
  'polymorph control': 'Polymorph control: you choose what you become, and avoid system shock.',
  'free action': 'Free action: paralysis and many holds cannot stop you.',
  'life saving': 'Life saving: the next death is cancelled (the amulet is used up).',
  'protection': 'Divine protection: extra AC from a priest donation or prayer.',
  'clairvoyance': 'Clairvoyance: now and then you glimpse the map around you.',
  'fast hunger': 'Hunger: you get hungry much faster than normal (a ring or amulet causes it).',
  'aggravate': 'Aggravate monster: monsters wake and come for you.',
  'Satiated': 'Satiated: nutrition over 1000. Eating more risks choking once past 2000. Stop eating until it clears.',
  'Hungry': 'Hungry: nutrition under 150. Eat soon.',
  'Weak': 'Weak: nutrition under 50. You lose Strength until you eat. Counts as major trouble for prayer.',
  'Fainting': 'Fainting: you pass out now and then. Eat at once, or pray.',
  'Burdened': 'Burdened: carrying more than your capacity. You are slower.',
  'Stressed': 'Stressed: well over capacity. Much slower, and no HP regeneration.',
  'Strained': 'Strained: far over capacity. Very slow.',
  'Overtaxed': 'Overtaxed: barely able to move.',
  'Overloaded': 'Overloaded: you cannot move at all.',
  'Blind': 'Blind: you cannot see the map, only feel it. Telepathy works while blind.',
  'Conf': 'Confused: movement goes astray, and scrolls do odd things when read.',
  'Stun': 'Stunned: you move in random directions.',
  'Hallu': 'Hallucinating: monsters and items look random. You cannot trust what you see.',
  'Sick': 'Ill: fatal soon. Pray, eat a eucalyptus leaf, or apply a unicorn horn.',
  'Slime': 'Turning into green slime: fatal soon. Pray, or burn it off with fire.',
  'Stone': 'Turning to stone: fatal in a few turns. Eat a lizard corpse or acidic corpse, or pray.',
  'Strngl': 'Being strangled: remove the amulet now, or pray.',
  'Lev': 'Levitating: you cannot pick things up or go down stairs.',
  'Fly': 'Flying.',
  'Ride': 'Riding your steed.',
  'tame': 'Tameness from 1 to 20. Feeding treats raises it; abuse lowers it. A pet below about 10 may go feral if left alone.',
  'Pet': 'Your pet. Pets fight for you, can steal from shops, and tell you which items are cursed: a pet will not willingly step on a cursed item.',
};
const T = (key, text) => `<span class="term" data-term="${esc(key)}">${esc(text ?? key)}</span>`;
const pv = (key, val) => `${T(key)} ${esc(val)}`;

function character(d) {
  const st = d.state.status, you = d.state.player || {}, rev = d.state.reveal || {}, pray = rev.prayer;
  if (!st) return '';
  const frac = st.hp / (st.hpmax || 1), hp = frac >= 1 ? 'green' : frac >= .5 ? 'yellow' : 'red';
  const flags = [st.hunger, st.encumbrance, ...(st.conditions || [])].filter(Boolean);
  const sp = ' &nbsp; ';
  let h = `<h3>Character</h3><div class="b">${esc((st.gender || '').replace(/^./, c => c.toUpperCase()))} ${T(st.race || '')} ${T(st.role || '')}, ${T(st.alignment || '')}</div>
    <div class="b ${hp}">${pv('HP', `${st.hp}/${st.hpmax}`)}</div><div>${pv('Pw', `${st.pw}/${st.pwmax}`)}${sp}${pv('AC', st.ac)}</div>
    <div>${pv('Xp', `${st.xlvl}/${st.exp}`)}${sp}${pv('$', st.gold)}${sp}${pv('T', st.turn)}</div><div>${pv('Dlvl', st.dlvl)} ${T(st.dungeon || '')}</div>
    <div class="b">${pv('Location', `x=${you.x} y=${you.y}`)}</div>
    <div>${pv('St', strength(st.str))} ${pv('Dx', st.dex)} ${pv('Co', st.con)} ${pv('In', st.int)} ${pv('Wi', st.wis)} ${pv('Ch', st.cha)}</div>
    <div>${pv('Carrying', `${st.weight}/${st.capacity} wt`)}${sp}${pv('Speed', st.speed)}</div>
    <div>${T('Next level', 'Next level at')} ${esc(st.next_exp)} xp${sp}${T('God', 'God:')} ${T(st.god || '')}</div>`;
  if (pray) h += `<div class="magenta">${pv('Luck', pray.luck)}${sp}${pv('Prayer timeout', pray.timeout)}${sp}${pv('Nutrition', rev.nutrition)}${sp}${pv('Alignment', rev.align_record)}</div>
    <div class="magenta">${T('Intrinsics', 'Intrinsics:')} ${(rev.intrinsics || []).map(i => T(i)).join(', ') || 'none'}</div>`;
  for (const p of rev.pets || []) {
    const hunger = p.turns_until_hungry == null ? '?' : p.turns_until_hungry < 0 ? 'hungry now' : `hungry in ${p.turns_until_hungry}`;
    h += `<div class="b">${T('Pet', 'Pet:')} ${p.name ? esc(p.name) + ' the ' : ''}${T(p.species)} L${p.level} HP ${p.hp}/${p.hpmax} AC ${p.ac} Spd ${p.speed}</div>
      <div class="magenta">&nbsp; ${T('tame')} ${p.tameness}/20, ${hunger}, at x=${p.x} y=${p.y}${p.leashed ? ', leashed' : ''}${p.carrying.length ? ', carrying ' + p.carrying.map(c => T(c)).join(', ') : ''}</div>`;
  }
  return h + (flags.length ? `<div class="b yellow">${flags.map(f => T(f)).join(' ')}</div>` : '');
}

function fight(d) {
  const rev = d.state.reveal || {}, you = d.state.player || {};
  const near = (rev.monsters || []).filter(m => !m.tame && !m.peaceful && Math.max(Math.abs(m.x - you.x), Math.abs(m.y - you.y)) === 1);
  if (!near.length && !d.fight.length) return '';
  return '<h3>Fight</h3>' + near.map(m => `<div class="b">${T(m.name)} HP ${m.hp}/${m.hpmax ?? '?'}</div>`).join('')
    + d.fight.map(l => `<div class="magenta">${esc(l)}</div>`).join('');
}

function showTip(e, key) {
  const tip = $('#tip');
  tip.innerHTML = `<div class="b">${esc(key)}</div>${GLOSS[key] ? `<div>${esc(GLOSS[key])}</div>` : ''}
    <div class="acts"><button data-askterm="${esc(key)}">Ask the helper about it</button></div>`;
  tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, e.clientX - w / 2)) + 'px';
  tip.style.top = (e.clientY + 14 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 14) + 'px';
}

function inventory(d) {
  const inv = d.state.inventory || [], menu = d.menu, asked = d.asked;
  let h = menu ? `<h3 class="yellow">${esc(menu.title)}: click items, then Done</h3>`
        : asked ? `<h3 class="yellow">${esc(asked[0])} Click one</h3>` : '<h3>Inventory</h3>';
  for (const [sym, name] of GROUPS) {
    const items = inv.filter(i => i.class === sym);
    if (!items.length) continue;
    const whole = menu || asked || open.has(sym), shown = whole ? items : items.filter(i => IN_USE.test(i.text));
    const more = items.length - shown.length;
    h += `<div class="group" data-group="${esc(sym)}">${whole ? '▾' : '▸'} ${name}${more ? ` (${more} more)` : ''}</div>`;
    for (const i of shown) {
      let mark = ' ', cls = IN_USE.test(i.text) ? 'green' : '';
      if (menu) { const s = menu.items[i.letter]; mark = s ? '✓' : s === false ? ' ' : '·'; if (s === undefined) cls += ' off'; }
      else if (asked) { const fits = asked[1].includes(i.letter); mark = fits ? '>' : ' '; if (!fits) cls += ' off'; }
      h += `<div class="item ${cls}" data-letter="${esc(i.letter)}"><span>${mark}${esc(i.letter)})</span><span>${esc(i.text)}</span><span class="w">${i.weight ?? ''}</span></div>`;
      if (popup === i.letter && !menu && !asked)
        h += '<div class="acts">' + (d.actions[i.letter] || []).map(([k, label]) =>
          `<button data-act="${esc(k)}" data-letter="${esc(i.letter)}">${esc(label)}</button>`).join('') + '</div>';
    }
  }
  if (inv.length && inv.every(i => 'weight' in i)) {
    const st = d.state.status || {};
    h += `<div class="item b"><span>Total${st.capacity ? ` (${st.capacity} before you're Burdened)` : ''}</span><span class="w">${inv.reduce((a, i) => a + i.weight, 0)}</span></div>`;
  }
  if (menu) h += '<div class="acts"><button data-keys="&#13;">Done</button><button data-keys="&#27;">Cancel</button></div>';
  return h;
}

function chat(d) {
  const el = $('#chat'), atEnd = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  el.innerHTML = d.chat.map(([kind, text]) => `<div class="${esc(kind)}">${esc(text)}</div>`).join('')
    + (d.busy ? '<div class="dim">thinking...</div>' : '');
  if (atEnd) el.scrollTop = el.scrollHeight;
}

function savesList(d) {
  const u = d.saves;
  $('#saves').style.display = u ? 'grid' : 'none';
  if (!u) return;
  $('#savestitle').textContent = u.naming != null ? `New game, name: ${u.naming}_`
    : u.confirm === 'd' ? 'Delete this? Click Delete again to confirm.'
    : u.confirm === 'p' ? 'Keep only the newest 3 checkpoints of this character? Click Prune again.'
    : 'Saves (arrows and Enter work too)';
  $('#saves .list').innerHTML = u.items.length ? u.items.map((it, k) =>
    `<div class="row${k === u.sel ? ' sel' : ''}" data-sel="${k}"><span>${esc(it.char)}</span><span>${esc(it.what)}</span><span>${esc(it.when)}</span></div>`).join('')
    : '<div class="dim">No saved games or checkpoints yet.</div>';
  $('#saves .row.sel')?.scrollIntoView({block: 'nearest'});
}

function render(d) {
  last = d;
  $('#panel').innerHTML = character(d) + fight(d) + inventory(d);
  chat(d);
  savesList(d);
}

const stream = new EventSource('/events');
stream.addEventListener('out', m => term.write(Uint8Array.from(atob(JSON.parse(m.data)), c => c.charCodeAt(0))));
stream.addEventListener('state', m => render(JSON.parse(m.data)));

// clicks
document.addEventListener('click', e => {
  const t = e.target.closest('[data-zoom],[data-term],[data-askterm],[data-cmd],[data-group],[data-letter],[data-keys],[data-sel],[data-key],#opensaves,#newgame');
  if (!e.target.closest('#tip,[data-term]')) $('#tip').style.display = 'none';
  if (!t) return;
  if (t.dataset.zoom) { zoom(+t.dataset.zoom); term.focus(); return; }
  if (t.dataset.term) { showTip(e, t.dataset.term); return; }
  if (t.dataset.askterm) { $('#tip').style.display = 'none'; post('/ask', {q: `Tell me about "${t.dataset.askterm}" (from my status panel), for me right now.`}); }
  else if (t.dataset.cmd) post('/command', {name: t.dataset.cmd});
  else if (t.id === 'opensaves') post('/saves', {});
  else if (t.id === 'newgame') { const name = prompt('New character name:'); if (name) post('/saves', {key: 'n'}).then(() => post('/saves', {key: name})).then(() => post('/saves', {key: '\r'})); }
  else if (t.dataset.sel) post('/saves', {sel: +t.dataset.sel, key: e.detail > 1 ? '\r' : ''});
  else if (t.dataset.key) post('/saves', {key: t.dataset.key});
  else if (t.dataset.group) { open.has(t.dataset.group) ? open.delete(t.dataset.group) : open.add(t.dataset.group); localStorageSet('nh.open', JSON.stringify([...open])); render(last); }
  else if (t.dataset.keys) post('/key', {data: t.dataset.keys});
  else if (t.dataset.act) { popup = null; post('/item', {key: t.dataset.act, letter: t.dataset.letter}); }
  else if (t.dataset.letter) {
    if (last.menu || last.asked) post('/item', {key: '', letter: t.dataset.letter});
    else { popup = popup === t.dataset.letter ? null : t.dataset.letter; render(last); return; }
  }
  if (!e.target.closest('#ask')) term.focus();
});

$('#ask').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('#ask input').value.trim();
  if (q) post('/ask', {q});
  $('#ask input').value = '';
  term.focus();
});
</script>
</body>
</html>
